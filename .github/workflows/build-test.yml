name: Build and test (Windows and Linux)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Show toolchain
        shell: bash
        run: |
          cmake --version
          python --version
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build and run full regression chain
        run: cmake --build build --config Release --target check --parallel
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.os }}
          path: build/ctest-results.xml
          if-no-files-found: warn
      - name: Upload binaries
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: tmnt-tools-${{ matrix.os }}
          path: |
            build/Release/tmnt_*.exe
            build/tmnt_rominfo
            build/tmnt_disasm
            build/tmnt_flow
            build/tmnt_hwscan
            build/tmnt_vectors
            build/tmnt_entrydump
            build/tmnt_callscan
            build/tmnt_callgraph
            build/tmnt_cfg
            build/tmnt_recompile
            build/tmnt_system_bus_tests
            build/tmnt_system_events_tests
            build/tmnt_system_dma_tests
            build/tmnt_recompiled_*
          if-no-files-found: error
